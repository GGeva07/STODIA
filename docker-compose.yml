services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: stodia-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/stodia.db
      JWT_SECRET: ${JWT_SECRET:-}
      SEED_DEMO: "false"
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SUPERVISOR_PIN: ${SUPERVISOR_PIN:-}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-}
      TAX_ID: ${TAX_ID:-}
      ADDRESS: ${ADDRESS:-}
      CITY: ${CITY:-}
      PHONE: ${PHONE:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      RNC_VERIFICADO: ${RNC_VERIFICADO:-}
      RNC_RAZON_SOCIAL: ${RNC_RAZON_SOCIAL:-}
      RNC_NOMBRE_COMERCIAL: ${RNC_NOMBRE_COMERCIAL:-}
      RNC_ESTADO: ${RNC_ESTADO:-}
      RNC_VERIFICADO_AT: ${RNC_VERIFICADO_AT:-}
      CURRENCY: ${CURRENCY:-DOP}
      TIMEZONE: ${TIMEZONE:-America/Santo_Domingo}
      TZ: ${TIMEZONE:-America/Santo_Domingo}
      LICENSE_KEY: ${LICENSE_KEY:-}
      # Versión en marcha (la fija actualizar.sh) y canal público de actualizaciones (manifiesto JSON). Nada se instala sin aprobación del Super Admin.
      STODIA_VERSION: ${STODIA_VERSION:-}
      STODIA_UPDATE_URL: ${STODIA_UPDATE_URL:-https://stodia.vercel.app/releases/stable.json}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://stodiademo.synsetsolutions.com}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - stodia-data:/data
    ports:
      - ${API_BIND:-127.0.0.1}:${API_PORT:-3107}:3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: ${API_URL:-https://stodiademo.synsetsolutions.com}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-}
      API_PROXY_TARGET: http://api:3000
    ports:
      - ${WEB_PORT:-8080}:80

  backup:
    image: stodia-api
    profiles:
      - backup
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TIMEZONE:-America/Santo_Domingo}
    entrypoint:
      - sh
      - -c
    command:
      - |
        while true; do
          mkdir -p /data/backups
          if [ -f /data/stodia.db ]; then
            sqlite3 /data/stodia.db ".backup /data/backups/stodia-$$(date +%Y%m%d-%H%M%S).db" && echo "respaldo ok"
            find /data/backups -name 'stodia-*.db' -mtime +14 -delete
          fi
          sleep 86400
        done
    volumes:
      - stodia-data:/data

volumes:
  stodia-data: null
