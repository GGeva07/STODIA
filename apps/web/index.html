        <h1>STODIA, software de gestión escolar para colegios de República Dominicana</h1>
        <p>STODIA reúne en un solo sistema la inscripción, las notas, la asistencia, los cobros y planes de pago, el comedor, el inventario, la comunicación con las familias y el portal de tutores. Se ofrece en dos modalidades, instalado en tu propio servidor o alojado y mantenido por SynsetSolutions, siempre con una instancia por colegio, y funciona en navegador, celular (PWA y Android) y escritorio.</p>
        <h2>Módulos</h2>
        <p>Inscripción, notas, asistencia, horarios, expediente 360, cobros y finanzas, planes de pago, becas, venta rápida, inventario, comedor, planes de alimentación, portal de tutores, comunicaciones, catálogos maestros, auditoría, licenciamiento, roles y permisos, app móvil y aplicación de escritorio.</p>
